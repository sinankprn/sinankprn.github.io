research_profile: >
  I am a PhD Candidate in Sports Data Science and AI in the Next Generation
  Graduates Program (NGGP), supported by CSIRO Data61 and Rugby Australia.
  My research investigates how data science and machine learning can be used
  to strengthen community sport participation by identifying how club
  organisational characteristics influence participation growth and retention.
  The aim is to help national sporting organisations make evidence-based
  resource allocation decisions to improve retention, grow participation,
  and support long-term club sustainability.


  Alongside my PhD, I work as a Research Assistant on an applied AI project
  in partnership with the NSW Institute of Sport (NSWIS), exploring how
  Large Language Models can be leveraged in coach and athlete environments
  to automate content analysis and support more efficient insight generation
  and decision-making.
