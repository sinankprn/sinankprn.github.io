<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OG Template</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: {{ACCENT}};
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    font-family: 'Inter', system-ui, sans-serif;
    background: #08090d;
    color: #fff;
  }
  .card {
    position: relative;
    width: 1200px;
    height: 630px;
    overflow: hidden;
  }
  .bg {
    position: absolute;
    inset: 0;
    background-image: url('{{SOURCE}}');
    background-size: cover;
    background-position: center;
    filter: saturate(1.1) contrast(1.05);
  }
  .vignette {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at 70% 60%, rgba(0,0,0,0) 0%, rgba(0,0,0,0.55) 70%, rgba(0,0,0,0.85) 100%),
      linear-gradient(90deg, rgba(8,9,13,0.92) 0%, rgba(8,9,13,0.65) 45%, rgba(8,9,13,0.15) 100%);
  }
  .accent-bar {
    position: absolute;
    left: 60px;
    top: 70px;
    width: 14px;
    height: 90px;
    background: var(--accent);
    box-shadow: 0 0 30px var(--accent);
  }
  .content {
    position: absolute;
    left: 90px;
    top: 70px;
    right: 80px;
    display: flex;
    flex-direction: column;
    height: calc(100% - 140px);
  }
  .kicker {
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 22px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 18px;
  }
  .headline {
    font-family: 'Archivo Black', sans-serif;
    font-size: 96px;
    line-height: 0.95;
    letter-spacing: -2px;
    text-transform: uppercase;
    color: #fff;
    text-shadow:
      0 4px 20px rgba(0,0,0,0.9),
      0 0 60px rgba(0,0,0,0.6);
    max-width: 980px;
  }
  .headline.small { font-size: 78px; }
  .headline.xsmall { font-size: 64px; }
  .subtitle {
    margin-top: 28px;
    font-size: 28px;
    font-weight: 500;
    color: #d8dae0;
    max-width: 880px;
    text-shadow: 0 2px 12px rgba(0,0,0,0.8);
  }
  .footer {
    position: absolute;
    left: 90px;
    right: 80px;
    bottom: 50px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #fff;
  }
  .footer .site { color: var(--accent); }
  .noise {
    position: absolute;
    inset: 0;
    opacity: 0.04;
    pointer-events: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }
</style>
</head>
<body>
  <div class="card">
    <div class="bg"></div>
    <div class="vignette"></div>
    <div class="noise"></div>
    <div class="accent-bar"></div>
    <div class="content">
      <div class="kicker">{{KICKER}}</div>
      <div class="headline {{SIZE_CLASS}}">{{HEADLINE}}</div>
      <div class="subtitle">{{SUBTITLE}}</div>
    </div>
    <div class="footer">
      <div class="author">{{AUTHOR}}</div>
      <div class="site">{{SITE}}</div>
    </div>
  </div>
</body>
</html>
