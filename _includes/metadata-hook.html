<!-- Resource hints: faster first paint for Analytics and Google Fonts -->
<link rel="preconnect" href="https://www.googletagmanager.com" crossorigin>
<link rel="preconnect" href="https://www.google-analytics.com" crossorigin>
<link rel="dns-prefetch" href="https://www.googletagmanager.com">
<link rel="dns-prefetch" href="https://www.google-analytics.com">

<!-- Display + mono typefaces for editorial hero and accents -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..900;1,9..144,400&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

<!-- Allow Google (and AI Overviews) to show large image previews -->
<meta name="robots" content="max-image-preview:large">

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=AW-17919898476"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'AW-17919898476');
</script>

<!-- WebSite schema with SearchAction: enables sitelinks search box and gives AI engines a self-describing anchor -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "@id": "{{ site.url }}/#website",
  "url": "{{ site.url }}",
  "name": {{ site.title | jsonify }},
  "description": {{ site.description | jsonify }},
  "inLanguage": "en-AU",
  "publisher": { "@id": "{{ site.url }}/#person" },
  "potentialAction": {
    "@type": "SearchAction",
    "target": {
      "@type": "EntryPoint",
      "urlTemplate": "{{ site.url }}/?q={search_term_string}"
    },
    "query-input": "required name=search_term_string"
  }
}
</script>

{% if page.layout == 'post' %}
{% assign word_count = page.content | strip_html | number_of_words %}
{% assign primary_section = page.categories | first | default: page.tags | first | default: 'Blog' %}
<!-- BlogPosting Schema for SEO -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BlogPosting",
  "@id": "{{ site.url }}{{ page.url }}#blogposting",
  "headline": {{ page.title | jsonify }},
  "description": {{ page.description | default: site.description | jsonify }},
  "url": "{{ site.url }}{{ page.url }}",
  "datePublished": "{{ page.date | date_to_xmlschema }}",
  {% if page.last_modified_at %}"dateModified": "{{ page.last_modified_at | date_to_xmlschema }}",{% else %}"dateModified": "{{ page.date | date_to_xmlschema }}",{% endif %}
  "inLanguage": "en-AU",
  "isAccessibleForFree": true,
  "wordCount": {{ word_count }},
  "articleSection": {{ primary_section | jsonify }},
  "author": { "@id": "{{ site.url }}/#person" },
  "publisher": { "@id": "{{ site.url }}/#person" },
  "mainEntityOfPage": {
    "@type": "WebPage",
    "@id": "{{ site.url }}{{ page.url }}"
  },
  {% if page.image %}"image": "{{ site.url }}{{ page.image.path | default: page.image }}",{% else %}"image": "{{ site.url }}/assets/img/avatar.jpg",{% endif %}
  "keywords": {{ page.tags | join: ', ' | jsonify }}
}
</script>

<!-- Breadcrumb trail for rich results and AI hierarchy signals -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {
      "@type": "ListItem",
      "position": 1,
      "name": "Home",
      "item": "{{ site.url }}/"
    },
    {
      "@type": "ListItem",
      "position": 2,
      "name": "Posts",
      "item": "{{ site.url }}/"
    },
    {
      "@type": "ListItem",
      "position": 3,
      "name": {{ page.title | jsonify }},
      "item": "{{ site.url }}{{ page.url }}"
    }
  ]
}
</script>
{% endif %}
