name: Generate CV PDF

on:
  push:
    branches: [main]
    paths:
      - '_data/profile.yml'
      - '_data/education.yml'
      - '_data/positions.yml'
      - '_data/publications.yml'
      - '_data/talks.yml'
      - '_data/skills.yml'
      - '_data/awards.yml'
      - '_data/supervision.yml'
      - 'scripts/generate-cv.js'

jobs:
  generate-pdf:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install js-yaml
        run: npm install js-yaml

      - name: Generate cv.tex from data
        run: node scripts/generate-cv.js

      - name: Install DejaVu fonts
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-dejavu

      - name: Cache Tectonic bundle
        uses: actions/cache@v4
        with:
          path: ~/.cache/Tectonic
          key: tectonic-${{ runner.os }}-${{ hashFiles('cv.tex') }}
          restore-keys: |
            tectonic-${{ runner.os }}-

      - name: Setup Tectonic
        uses: wtfjoke/setup-tectonic@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate PDF
        run: |
          mkdir -p assets/docs
          tectonic -X compile cv.tex --outdir assets/docs

      - name: Commit PDF and cv.tex
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: regenerate cv from data"
          file_pattern: "cv.tex assets/docs/cv.pdf"

  trigger-deploy:
    needs: generate-pdf
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Trigger pages deploy
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'pages-deploy.yml',
              ref: 'main',
            });
